name: NuraMac
options:
  bundleIdPrefix: com.nura
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    PRODUCT_BUNDLE_IDENTIFIER: com.nura.player
    PRODUCT_NAME: Nura
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      NURA_RUST_LIB_DIR: "$(SRCROOT)/../../target/debug"
    Release:
      NURA_RUST_LIB_DIR: "$(SRCROOT)/../../target/release"
targets:
  NuraMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Nura
        INFOPLIST_KEY_CFBundleDisplayName: Nura
        LIBRARY_SEARCH_PATHS:
          - "$(NURA_RUST_LIB_DIR)"
        OTHER_LDFLAGS:
          - "-lnura_ffi"
          - "-framework"
          - AppKit
          - "-framework"
          - OpenGL
        SWIFT_OBJC_BRIDGING_HEADER: ""
    preBuildScripts:
      - name: Build Rust Player Core
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd "$SRCROOT/../.."
          if [ "$CONFIGURATION" = "Release" ]; then
            cargo build -p nura-ffi --release
          else
            cargo build -p nura-ffi
          fi
    postBuildScripts:
      - name: Bundle Verified libmpv Runtime
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "$SRCROOT/../../scripts/package-libmpv-runtime.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          fi
    scheme:
      gatherCoverageData: false
      testTargets: []
      run:
        config: Debug
      archive:
        config: Release
