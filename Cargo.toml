[workspace]
members = [
  "crates/nura-domain",
  "crates/nura-player-core",
  "crates/nura-library",
  "crates/nura-mpv",
  "crates/nura-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
libloading = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
